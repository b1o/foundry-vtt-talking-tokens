# Build the release assets when a GitHub release is published.
# The release gets three assets: module.json (the manifest that Foundry reads for updates), module.zip, and
# talking-tokens-bridge.exe. The release tag must be "v" + the version in module/module.json, the bridge version in
# bridge/package.json must be the same, and the download URL in module.json must point to this tag. Otherwise the
# check job fails and no asset is attached, so a release never ships parts that do not belong together.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Check that the versions and the download URL match the release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(jq -r .version module/module.json)"
          BRIDGE_VERSION="$(jq -r .version bridge/package.json)"
          DOWNLOAD="$(jq -r .download module/module.json)"
          EXPECTED_DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Release tag ${TAG} does not match module.json version ${VERSION} (expected tag v${VERSION})."
            exit 1
          fi
          if [ "${BRIDGE_VERSION}" != "${VERSION}" ]; then
            echo "::error::bridge/package.json version ${BRIDGE_VERSION} does not match module.json version ${VERSION}."
            exit 1
          fi
          if [ "${DOWNLOAD}" != "${EXPECTED_DOWNLOAD}" ]; then
            echo "::error::module.json download is ${DOWNLOAD}, expected ${EXPECTED_DOWNLOAD}."
            exit 1
          fi

  module:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      # module.json is at the root of the zip, as Foundry expects.
      - name: Build module.zip
        working-directory: module
        run: zip -r ../module.zip .

      - name: Attach the module assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" module/module.json module.zip --clobber

  bridge:
    needs: check
    runs-on: windows-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      # The same Node version as the "volta" pin in package.json; @discordjs/voice 0.19 needs Node 22.12 or later.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      # The Bun version of spike 1 (PLAN.md section 10), which embeds the DAVE native addon without a patch.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # On the Windows runner, npm installs the Windows build of the native addon, which Bun embeds.
      - name: Install the dependencies
        run: npm ci

      - name: Build talking-tokens-bridge.exe
        run: npm run build --workspace bridge

      - name: Attach the bridge to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" bridge/out/talking-tokens-bridge.exe --clobber
